name: Unpack PRD Builder payload

on:
  push:
    branches:
      - agent/add-prd-builder-v2
    paths:
      - .payload/READY

permissions:
  contents: write

jobs:
  unpack-and-test:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Rebuild archive
        shell: bash
        run: |
          cat .payload/prd-builder-v2.tar.gz.b64.part-* | base64 --decode > /tmp/prd-builder-v2.tar.gz
          echo "8de599d60b724c4fa54c8350bb841023e54b78030fdf1b15f20d75c9526738e8  /tmp/prd-builder-v2.tar.gz" | sha256sum --check
          tar -xzf /tmp/prd-builder-v2.tar.gz

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r prd-builder/requirements.txt -r prd-builder/requirements-dev.txt

      - name: Validate skill
        run: |
          python -m compileall -q prd-builder
          pytest -q prd-builder/tests

      - name: Commit extracted skill
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add prd-builder
          git commit -m "Add PRD Builder Skill v2 and architecture report"
          git push
